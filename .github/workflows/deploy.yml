# Deploy Mahmudul Hasan's portfolio to GitHub Pages.
#
# Auto-detects the correct basePath:
#   - Project page  (repo "portfolio")  → https://<user>.github.io/portfolio/
#   - User page     (repo "<user>.github.io") → https://<user>.github.io/
#
# Override by setting the `BASE_PATH` repository variable
# (Settings → Secrets and variables → Actions → Variables).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute base path
        id: basePath
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          USER_SET="${{ vars.BASE_PATH }}"
          if [ -n "$USER_SET" ]; then
            # User explicitly set BASE_PATH — use it as-is (can be empty for user pages)
            echo "value=$USER_SET" >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            # User/org page — serve from root
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            # Project page — default to /<repo-name>
            echo "value=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Print resolved base path
        run: echo "Using basePath=${{ steps.basePath.outputs.value }}"

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basePath.outputs.value }}
        run: bun run build:static

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Verify basePath applied to HTML
        run: |
          echo "--- Checking index.html for basePath-prefixed assets ---"
          grep -oE '(href|src)="[^"]*_next/[^"]*"' out/index.html | head -3 || true
          echo "---"
          grep -oE 'href="[^"]*manifest[^"]*"' out/index.html | head -1 || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
